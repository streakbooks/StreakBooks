version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 0 disables routine npm version PRs; Dependabot security updates still apply.
    # Framework upgrades (e.g. TanStack Start server-function typing) need planned work.
    open-pull-requests-limit: 0
    groups:
      nonbreaking-dependencies:
        update-types:
          - patch
          - minor
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
