name: LinkBooks static and isolated quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm run check:migrations
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test -- --maxWorkers=4
      - run: npm run check:modules
      - run: npm run check:ui
      - run: node --test scripts/lib/ui-route-source.test.mjs
      - run: npm run check:navigation
      - run: npm run check:lookups
      - run: npm run build
      - run: npm run check:bundle
      - name: State the scope of these gates
        run: echo "These checks certify static and isolated tests only. Authenticated staging, full-schema upgrade, production approval and deployment remain separate release gates."

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script: ["test:workflows:postgres", "test:platform:postgres", "test:banking:postgres", "test:pos:postgres"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  browser-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:banking:ui
      - name: Scope of browser evidence
        run: echo "These are isolated UI fixtures. Real Auth/RLS and hosted staging acceptance remain separate gates."
