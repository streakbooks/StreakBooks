name: LinkBooks quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint changed files (legacy errors tracked separately)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | grep -E '\.(js|jsx|ts|tsx)$' || true)
          if [ ${#changed[@]} -gt 0 ]; then npx eslint "${changed[@]}"; fi

      - name: Unit tests
        run: npm test

      - name: Native navigation checks
        run: npm run check:navigation

      - name: Validate authenticated browser test discovery
        run: npx playwright test e2e/native-navigation.spec.ts --list

      - name: Production build
        run: npm run build

  staging-browser:
    # Opt in with a verified, dedicated staging URL and test account.
    if: ${{ github.event_name == 'pull_request' && vars.E2E_STAGING_ENABLED == 'true' && vars.E2E_STAGING_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated staging browser tests
        env:
          E2E_BASE_URL: ${{ vars.E2E_STAGING_URL }}
          E2E_EMAIL: ${{ secrets.E2E_STAGING_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_STAGING_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$E2E_EMAIL" || -z "$E2E_PASSWORD" ]]; then
            echo "Staging E2E credentials are required to enable browser testing." >&2
            exit 1
          fi
          case "$E2E_BASE_URL" in
            https://*) ;;
            *) echo "Staging tests require a HTTPS URL." >&2; exit 1 ;;
          esac
          npx playwright test e2e/native-navigation.spec.ts
