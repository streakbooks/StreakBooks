name: LinkBooks quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prevent tracked local secrets and generated artifacts
        run: npm run check:repository

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint (zero errors or warnings)
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test -- --maxWorkers=4

      - name: Module, UI, navigation and lookup contracts
        run: |
          npm run check:modules
          npm run check:ui
          npm run check:navigation
          npm run check:lookups

      - name: Production build
        run: npm run build

      - name: Client bootstrap JS budget
        run: npm run check:bundle

      - name: State the scope of these gates
        run: |
          echo "These checks certify static and isolated local gates only."
          echo "Authenticated staging, full-schema upgrade, production approval and deployment remain separate release gates."

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        script: [test:workflows:postgres, test:platform:postgres]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Isolated PostgreSQL suite
        run: npm run ${{ matrix.script }}
