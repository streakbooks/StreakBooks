name: LinkBooks verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check:lookups
      - run: npm run check:navigation
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  voice-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:wake
      - run: npm run test:voice
      - run: npm run test:practice
      - run: npm run test:corrections
      - run: npm run test:themes
      - run: npm run test:reporting
  navigation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:navigation
  platform-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: docker pull postgres:17
      - run: npm run test:platform:postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run test:platform
